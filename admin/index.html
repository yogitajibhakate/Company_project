<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Suhalaya Travels</title>
  
  <!-- STYLESHEETS -->
  <link rel="stylesheet" href="/css/style.css?v=3">
  
  <style>
    body {
      background-color: var(--color-alabaster);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    
    .admin-login-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
    }
    
    .admin-login-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('/assets/images/hero_luxury_sedan.png');
      background-size: cover;
      background-position: center;
      filter: blur(8px) brightness(0.6);
      z-index: -1;
    }

    .admin-login-card {
      background: #ffffff;
      padding: 40px;
      border-radius: var(--border-radius-md);
      box-shadow: var(--box-shadow-premium);
      width: 100%;
      max-width: 450px;
      border-top: 4px solid var(--color-gold);
    }

    .admin-login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .admin-login-header img {
      height: 48px;
      margin: 0 auto 16px auto;
    }

    .admin-login-header h2 {
      font-size: 1.8rem;
      color: var(--color-obsidian);
      margin-bottom: 8px;
    }

    .admin-login-header p {
      color: var(--color-slate-light);
      font-size: 0.95rem;
    }

    .admin-form-group {
      margin-bottom: 20px;
    }

    .admin-form-group label {
      display: block;
      color: var(--color-obsidian);
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .admin-form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid rgba(1, 90, 132, 0.2);
      border-radius: var(--border-radius-sm);
      font-size: 1rem;
      transition: var(--transition-fast);
      background: #f8fafc;
    }

    .admin-form-group input:focus {
      border-color: var(--color-gold);
      background: #ffffff;
      box-shadow: 0 0 10px rgba(26, 183, 234, 0.15);
    }

    .admin-login-btn {
      width: 100%;
      padding: 16px;
      font-size: 1.05rem;
      margin-top: 10px;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 24px;
      color: var(--color-slate-light);
      font-size: 0.9rem;
      transition: var(--transition-fast);
    }

    .back-home:hover {
      color: var(--color-gold);
    }
  </style>
</head>

<body>
  
  <div class="admin-login-container">
    <div class="admin-login-bg"></div>
    
    <div class="admin-login-card">
      <div class="admin-login-header">
        <img src="/assets/images/logo.png" alt="Suhalaya Travels Logo">
        <h2>Admin Portal</h2>
        <p>Sign in to manage bookings and dashboard.</p>
      </div>

      <form action="#" method="POST" id="adminLoginForm">
        <div class="admin-form-group">
          <label for="username">Username / Email</label>
          <input type="text" id="username" name="username" placeholder="Enter your admin username" required>
        </div>

        <div class="admin-form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn btn-primary admin-login-btn">Secure Login</button>
      </form>

      <a href="/" class="back-home">
        &larr; Back to Homepage
      </a>
    </div>
  </div>

  <script>
    document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (username === 'admin@gmail.com' && password === 'admin@123') {
        window.location.href = '/admin/dashboard.html';
      } else {
        alert('Invalid email or password. Please try again.');
      }
    });
  </script>
</body>

</html>
